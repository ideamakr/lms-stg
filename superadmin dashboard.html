<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise IT Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --primary: #2563eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            margin: 0; padding: 40px; color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { max-width: 1200px; margin: 0 auto; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
        .header h1 { font-size: 2rem; font-weight: 800; margin: 0; letter-spacing: -0.03em; }
        .header p { color: var(--text-muted); font-size: 0.95rem; margin: 8px 0 0 0; font-weight: 500; }
        
        .btn-modern {
            background: var(--text-main); color: white; border: none; padding: 12px 24px;
            border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .btn-modern:hover { background: #334155; transform: translateY(-1px); }

        /* =========================================
           YOUR CUSTOM CARD CSS (Integrated & Polished)
           ========================================= */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 40px; }
        
        .card {
            padding: 1.5rem; /* Slightly increased padding for breathing room */
            background-color: #fff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 320px;
            border-radius: 20px;
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); }

        .title { display: flex; align-items: center; }

        .title span {
            position: relative;
            padding: 0.5rem;
            width: 1.8rem; /* Adjusted slightly to perfectly fit FontAwesome icons */
            height: 1.8rem;
            border-radius: 9999px;
        }

        .title span i {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 0.9rem;
        }

        .title-text {
            margin: 0 0 0 0.75rem; /* Cleaned up margin */
            color: #374151;
            font-size: 16px; /* Adjusted to fit layout */
            font-weight: 700;
        }

        .percent {
            margin-left: auto; /* Pushes the percentage to the right */
            font-size: 0.85rem;
            font-weight: 700;
        }

        .data { display: flex; flex-direction: column; justify-content: flex-start; }

        .data p {
            margin-top: 1rem;
            margin-bottom: 1rem;
            color: #1F2937;
            font-size: 2.25rem;
            line-height: 2.5rem;
            font-weight: 800;
            text-align: left;
        }

        .data .range {
            position: relative;
            background-color: #E5E7EB;
            width: 100%;
            height: 0.5rem;
            border-radius: 0.25rem;
            overflow: hidden;
        }

        .data .range .fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 0.25rem;
            transition: width 1s ease-in-out;
        }

        /* Modern Table (From previous prototype) */
        .table-container { background: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); overflow: hidden; }
        .table-toolbar { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 16px 24px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-light); }
        td { padding: 20px 24px; font-size: 0.9rem; border-bottom: 1px solid #f8fafc; vertical-align: middle; }
        tr:hover td { background: #f8fafc; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .badge-p1 { background: #fee2e2; color: #dc2626; }
        .btn-action { background: white; border: 1px solid var(--border-light); color: var(--text-main); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .btn-action:hover { background: #f8fafc; border-color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <div>
                <h1>IT Command Center</h1>
                <p><i class="far fa-calendar-alt"></i> Wednesday, Oct 25, 2024</p>
            </div>
            <button class="btn-modern">
                <i class="fas fa-plus"></i> New IT Case
            </button>
        </div>

        <div class="kpi-grid">
            
            <div class="card">
                <div class="title">
                    <span style="background-color: #10B981;"><i class="fas fa-users"></i></span>
                    <p class="title-text">Total Fleet</p>
                </div>
                <div class="data">
                    <p>124</p>
                    <div class="range"><div class="fill" style="background-color: #10B981; width: 100%;"></div></div>
                </div>
            </div>

            <div class="card">
                <div class="title">
                    <span style="background-color: #3b82f6;"><i class="fas fa-user-check"></i></span>
                    <p class="title-text">Active Users</p>
                    <p class="percent" style="color: #3b82f6;">95%</p>
                </div>
                <div class="data">
                    <p>118</p>
                    <div class="range"><div class="fill" style="background-color: #3b82f6; width: 95%;"></div></div>
                </div>
            </div>

            <div class="card">
                <div class="title">
                    <span style="background-color: #ef4444;"><i class="fas fa-user-minus"></i></span>
                    <p class="title-text">Inactive</p>
                    <p class="percent" style="color: #ef4444;">5%</p>
                </div>
                <div class="data">
                    <p>6</p>
                    <div class="range"><div class="fill" style="background-color: #ef4444; width: 5%;"></div></div>
                </div>
            </div>

            <div class="card">
                <div class="title">
                    <span style="background-color: #f59e0b;"><i class="fas fa-ticket-alt"></i></span>
                    <p class="title-text">Open Cases</p>
                    <p class="percent" style="color: #f59e0b;">+2</p>
                </div>
                <div class="data">
                    <p>3</p>
                    <div class="range"><div class="fill" style="background-color: #f59e0b; width: 30%;"></div></div>
                </div>
            </div>

        </div>

        <div class="table-container">
            <div class="table-toolbar">
                <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700;"><i class="fas fa-layer-group" style="color: #64748b; margin-right: 8px;"></i> Active Incident Triage</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Reporter</th>
                        <th>Title / Issue</th>
                        <th>Urgency</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="font-weight: 600; color: var(--text-muted);">#INC-8092</td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="https://ui-avatars.com/api/?name=Natasha+Romanoff&background=f1f5f9" style="width: 36px; height: 36px; border-radius: 50%;">
                                <div>
                                    <div style="font-weight: 600;">Natasha Romanoff</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">HR Administrator</div>
                                </div>
                            </div>
                        </td>
                        <td style="font-weight: 500;">Cannot add new employee</td>
                        <td><span class="badge badge-p1"><i class="fas fa-fire"></i> P1 - Critical</span></td>
                        <td><button class="btn-action">Review</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
