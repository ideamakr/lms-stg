<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Leave System</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Base Styles */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, system-ui, sans-serif;
        /* Modern Gradient Mesh Background */
        background: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.1) 0, transparent 50%), 
                    radial-gradient(at 50% 0%, rgba(29, 78, 216, 0.05) 0, transparent 50%), 
                    radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.1) 0, transparent 50%),
                    #f8fafc;
        overflow: hidden; /* Prevents scrollbars with particles */
      }

      .login-card {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
        border-top: 4px solid #2563eb; /* Pro Brand Strip */
        z-index: 10; /* Keeps card above particles */
      }

      h2 { color: #2563eb; margin-bottom: 0.5rem; }
      .subtitle { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
      
      input {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        box-sizing: border-box;
      }

      button {
        background: #2563eb;
        color: white;
        padding: 0.75rem;
        border: none;
        border-radius: 6px;
        width: 100%;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }

      .admin-note {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #ef4444;
        background: #fef2f2;
        padding: 10px;
        border-radius: 4px;
      }

      /* 🚀 MODAL ANIMATION */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="particles-js" style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 1;"></div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; z-index: 10;">
      
      <div class="login-card">
        <h2>Employee Portal</h2>
        <p class="subtitle">Please sign in to manage your leave</p>

        <form onsubmit="handleLogin(event)">
          <input type="text" id="username" placeholder="Username" required />
          <input type="password" id="password" placeholder="Password" required />
          <button type="submit">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 20px">
          <a href="javascript:void(0)" onclick="handleForgotPassword()" style="font-size: 0.85rem; color: #64748b; text-decoration: none;">
            Forgot username or password?
          </a>
        </div>

        <div class="admin-note">
          Authorized users only. Unauthorized access is prohibited.
        </div>

        <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px;">
          <div style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;">
              version <span id="login_version_display" style="color: #2563eb;">Checking...</span>
          </div>
        </div>
      </div> 

      <footer style="margin-top: 30px; text-align: center;">
        <p style="font-size: 0.8rem; color: #94a3b8; margin: 0; opacity: 0.8;">
            © 2026 <span style="color: #2563eb; font-weight: 600;">IdeaMakr</span> 
            • All rights reserved.
        </p>
      </footer>
    </div>

    <!-- Reusable Error Modal -->
    <div
      id="errorModal"
      style="
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.6);
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      "
    >
      <div
        style="
          background-color: #fefefe;
          margin: auto;
          padding: 30px;
          border-radius: 12px;
          text-align: center;
          width: 90%;
          max-width: 350px;
          animation: fadeIn 0.3s;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        "
      >
        <div
          style="
            width: 60px;
            height: 60px;
            background: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px auto;
          "
        >
          <i class="fas fa-times"></i>
        </div>
        <h2
          style="
            color: #ef4444;
            margin-top: 0;
            margin-bottom: 10px;
            border: none;
            font-size: 1.25rem;
          "
        >
          Login Failed
        </h2>
        <p
          id="errorMessage"
          style="
            color: #4b5563;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
          "
        >
          Invalid credentials.
        </p>
        <button
          onclick="closeErrorModal()"
          style="
            background-color: #ef4444;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
          "
        >
          OK
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
      /**
       * 📡 DYNAMIC API URL DETECTION
       * This centralizes your API endpoint configuration.
       */
      const getApiUrl = () => {
        const host = window.location.hostname;
        // Check for local development environments
        if (host === "127.0.0.1" || host === "localhost") {
          return "http://127.0.0.1:8000";
        }
        // Staging/Production Environment
        return "https://leave-system-testenv.onrender.com";
      };

      const API_URL = getApiUrl();
      console.log("🌐 Initializing handshake with API:", API_URL);

      // Initialize Particles background
      particlesJS("particles-js", {
        "particles": {
          "number": { "value": 150 },
          "color": { "value": "#2563eb" },
          "shape": { "type": "circle" },
          "opacity": { "value": 0.8 },
          "size": { "value": 3 },
          "line_linked": {
            "enable": true,
            "distance": 100,
            "color": "#2563eb",
            "opacity": 0.3,
            "width": 1
          },
          "move": { "enable": true, "speed": 2 }
        }
      });

      /**
       * 🛡️ MAINTENANCE GATEKEEPER
       * Checks backend for broadcast messages or maintenance locks.
       */
      async function runMaintenanceCheck() {
        try {
          const res = await fetch(`${API_URL}/settings/branding?t=${new Date().getTime()}`);
          if (!res.ok) return;
          const data = await res.json();
          
          if (!data.broadcast_enabled || !data.broadcast_start || !data.broadcast_end) return;

          const now = new Date();
          // Force standard format for date parsing across browsers
          const start = new Date(data.broadcast_start.replace(/-/g, "/").replace("T", " "));
          const end = new Date(data.broadcast_end.replace(/-/g, "/").replace("T", " "));

          if (now >= start && now <= end) {
              const isLockMode = data.maintenance_mode === true;
              const injectInterval = setInterval(() => {
                const card = document.querySelector(".login-card");
                if (card) {
                  clearInterval(injectInterval);
                  if (document.getElementById("maint-banner")) return;

                  const banner = document.createElement("div");
                  banner.id = "maint-banner";
                  banner.style = "background:#fffbeb; border:1px solid #fde68a; padding:15px; border-radius:8px; margin-bottom:20px; color:#92400e; font-size:0.85rem; font-weight:600; border-left:4px solid #f59e0b; text-align:left; animation: fadeIn 0.4s ease;";
                  
                  const icon = isLockMode ? 'fa-tools' : 'fa-bullhorn';
                  banner.innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><i class="fas ${icon}"></i> <span>${data.broadcast_message}</span></div>`;

                  card.prepend(banner);
                }
              }, 50);
          }
        } catch (e) {
          console.warn("Gatekeeper fetch failed:", e);
        }
      }
      
      /**
       * 🚀 VERSION LOGIC
       * Displays system version from backend.
       */
      async function loadLoginVersion() {
          const display = document.getElementById('login_version_display');
          if (!display) return;

          try {
              const res = await fetch(`${API_URL}/settings/branding?t=${new Date().getTime()}`);
              if (res.ok) {
                  const data = await res.json();
                  if (data.system_version) {
                      display.innerText = data.system_version;
                      display.style.color = "#2563eb";
                  } else {
                      display.innerText = "v1.0.0"; // Default
                  }
              } else {
                  display.innerText = "OFFLINE";
                  display.style.color = "#ef4444";
              }
          } catch (e) {
              display.innerText = "OFFLINE";
              display.style.color = "#ef4444";
          }
      }

      // 🔴 ERROR MODAL HELPERS
      function showError(message) {
        const msgEl = document.getElementById("errorMessage");
        const modalEl = document.getElementById("errorModal");
        if (msgEl) msgEl.innerText = message;
        if (modalEl) modalEl.style.display = "flex";
      }
    
      function closeErrorModal() {
        const modalEl = document.getElementById("errorModal");
        const passInput = document.getElementById("password");
        if (modalEl) modalEl.style.display = "none";
        if (passInput) {
          passInput.value = ""; 
          passInput.focus();
        }
      }
    
      window.onclick = function (event) {
        const modal = document.getElementById("errorModal");
        if (event.target == modal) closeErrorModal();
      };

      /**
       * 🔐 LOGIN HANDLER
       */
      async function handleLogin(event) {
        event.preventDefault(); 
        localStorage.clear(); 
    
        const usernameInput = document.getElementById("username").value.trim().toLowerCase();
        const passwordInput = document.getElementById("password").value;
    
        try {
            const loginData = {
                username: usernameInput,
                password: passwordInput
            };
    
            const res = await fetch(`${API_URL}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(loginData),
            });
    
            if (res.ok) {
                const data = await res.json();
                
                // Persistence
                localStorage.setItem("currentUser", data.full_name); 
                localStorage.setItem("username", usernameInput);       
                localStorage.setItem("userRoles", JSON.stringify(data.roles));
                
                if (data.session_id) {
                    localStorage.setItem("sessionId", data.session_id);
                } else {
                    localStorage.setItem("sessionId", "session-" + new Date().getTime());
                }

                if (data.roles && data.roles.length > 0) {
                     localStorage.setItem("userMasterRole", data.roles[0]); 
                     localStorage.setItem("role", data.roles[0]); 
                } else {
                     localStorage.setItem("userMasterRole", "employee");
                     localStorage.setItem("role", "employee");
                }

                window.location.replace("dashboard.html");
            } else {
                const errorData = await res.json();
                if (res.status === 503) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'System Locked',
                        text: errorData.detail || "Maintenance Mode active.",
                        confirmButtonColor: '#f59e0b'
                    });
                } else {
                    showError(errorData.detail || "Invalid credentials");
                }
            }
        } catch (e) {
            console.error("Login attempt failed:", e);
            showError("System Error: Cannot connect to server.");
        }
      }
    
      /**
       * 🔑 FORGOT PASSWORD HANDLER
       */
      async function handleForgotPassword() {
        const { value: email } = await Swal.fire({
          title: "Account Recovery",
          text: "Enter your email and we will send your username and a temporary password.",
          input: "email",
          inputPlaceholder: "e.g. employee@company.com",
          showCancelButton: true,
          confirmButtonColor: "#2563eb",
          cancelButtonColor: "#94a3b8",
          confirmButtonText: "Recover My Account",
          footer: '<span style="font-size: 0.75rem; color: #64748b;">Note: This will reset your password for security.</span>',
        });
    
        if (email) {
          Swal.fire({
            title: "Processing...",
            html: "Verifying email and generating credentials...",
            allowOutsideClick: false,
            didOpen: () => {
              Swal.showLoading();
            },
          });
    
          try {
            const formData = new FormData();
            formData.append("email", email);
            const res = await fetch(`${API_URL}/users/forgot-password`, {
              method: "POST",
              body: formData,
            });
    
            if (res.ok) {
              Swal.fire({
                icon: "success",
                title: "Check Your Inbox",
                text: "If an account exists, your username and new password have been sent.",
                confirmButtonColor: "#2563eb",
              });
            } else {
              const err = await res.json();
              Swal.fire("Request Failed", err.detail || "Could not process account recovery.", "error");
            }
          } catch (error) {
            Swal.fire("Connection Error", "Check your internet or server status.", "error");
          }
        }
      }

      function togglePass(id) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
        } else {
          input.type = "password";
        }
      }

      // Start services on load
      document.addEventListener('DOMContentLoaded', () => {
          runMaintenanceCheck();
          loadLoginVersion();
      });
    </script>
  </body>
</html>
